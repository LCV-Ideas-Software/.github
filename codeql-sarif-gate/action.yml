name: LCV CodeQL SARIF Gate
description: Validates CodeQL SARIF structure and enforces zero reported results.

inputs:
  sarif-directory:
    description: Directory containing the CodeQL SARIF files to validate.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Enforce strict CodeQL SARIF policy
      shell: bash
      env:
        SARIF_DIRECTORY_INPUT: ${{ inputs.sarif-directory }}
      run: bash "$GITHUB_ACTION_PATH/enforce.sh"
