name: Dependabot native auto-merge
description: Rebase stale Dependabot branches and admit eligible PRs to the native merge queue.

inputs:
  github_token:
    description: PAT or GitHub App token allowed to update PR branches and use the merge queue.
    required: true
  repository:
    description: Repository in owner/name form.
    required: true

runs:
  using: composite
  steps:
    - name: Reconcile Dependabot pull requests
      shell: bash
      env:
        AUTOMATION_TOKEN: ${{ inputs.github_token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
      run: node "$GITHUB_ACTION_PATH/main.mjs"
