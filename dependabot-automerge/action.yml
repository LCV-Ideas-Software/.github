name: LCV Dependabot Automerge Controller
description: Validates, refreshes, approves and squash-merges trusted Dependabot pull requests.

inputs:
  github_token:
    description: Ephemeral GITHUB_TOKEN used for Actions provenance, checks and approval.
    required: true
  automation_token:
    description: Automation credential used only for rebase/recreate commands and exact-head merge.
    required: true
  required_checks_json:
    description: JSON array of exact {name,app_id} check identities that must conclude success.
    required: true

runs:
  using: node24
  main: main.mjs
