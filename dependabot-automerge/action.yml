name: LCV Dependabot Automerge Controller
description: Validates, rebases, approves and squash-merges canonical Dependabot pull requests.

inputs:
  github_token:
    description: Ephemeral GITHUB_TOKEN used for Actions provenance, checks and approval.
    required: true
  automation_token:
    description: Automation credential used only for guarded rebase comments and exact-head squash merges.
    required: true
  required_checks_json:
    description: JSON array of exact {name,app_id} check identities that must conclude success.
    required: true
  settle_timeout_seconds:
    description: Maximum bounded wait for checks that finish just after workflow_run.
    required: false
    default: "180"
  settle_poll_seconds:
    description: Interval between immutable-head check revalidations.
    required: false
    default: "10"

runs:
  using: node24
  main: main.mjs
