# Organization workflow template — zizmor static analysis of workflow files.
#
# Move the cron minute and hour so repositories do not all scan at once. Only
# $default-branch is substituted when a workflow is created from a template, so
# the schedule below is a literal value.
#
# INFORMATIVE, NOT BLOCKING: with SARIF output (advanced-security defaults to
# true) zizmor exits 0 even when it reports findings; the findings appear under
# Security > Code scanning.

name: Zizmor

on:
  push:
    branches:
      - $default-branch
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "13 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # Publish the zizmor SARIF to code scanning.
      contents: read # Check out the repository.
      actions: read # Read workflow metadata for the upload.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
