# Organization workflow template — OpenSSF Scorecard supply-chain analysis.
#
# Move the cron minute and hour so repositories do not all scan at once.
# Scorecard only produces meaningful results for the default branch.

name: Scorecard supply-chain security

on:
  push:
    branches:
      - $default-branch
  schedule:
    - cron: "37 8 * * 1"

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Required by Scorecard's workflow supply-chain checks.
      checks: read # Required by Scorecard to inspect configured status checks.
      contents: read # Required to analyze repository history and configuration.
      issues: read # Required by Scorecard's maintenance checks.
      pull-requests: read # Required by Scorecard's code-review checks.
      security-events: write # Required to upload the Scorecard SARIF result.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Neutral default, valid for public and private repositories alike. A
          # public repository that wants the OpenSSF badge and the public
          # api.scorecard.dev entry sets this to true and also adds
          # `id-token: write` to the job permissions above.
          publish_results: false

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
