# Organization workflow template — OpenSSF Scorecard supply-chain analysis.
#
# AFTER CREATING THIS WORKFLOW, BEFORE OPENING THE PULL REQUEST:
#   1. Install the lock tool once: `gh extension install github/gh-actions-lock`
#   2. Run `gh actions-lock` in the repository root.
#   3. Commit the regenerated `.github/workflows/actions.lock` IN THE SAME pull
#      request, or the Enterprise required workflow "Validate actions.lock"
#      fails the pull request.
#
# Move the cron minute and hour so repositories do not all scan at once.

name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "37 8 * * 1"
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard only produces meaningful results for the default branch.
    if: >-
      github.ref == 'refs/heads/$default-branch' ||
      github.event_name == 'branch_protection_rule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Required by Scorecard's workflow supply-chain checks.
      checks: read # Required by Scorecard to inspect configured status checks.
      contents: read # Required to analyze repository history and configuration.
      issues: read # Required by Scorecard's maintenance checks.
      pull-requests: read # Required by Scorecard's code-review checks.
      security-events: write # Required to upload the Scorecard SARIF result.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Neutral default, valid for public and private repositories alike. A
          # public repository that wants the OpenSSF badge and the public
          # api.scorecard.dev entry sets this to true and also adds
          # `id-token: write` to the job permissions above.
          publish_results: false

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
