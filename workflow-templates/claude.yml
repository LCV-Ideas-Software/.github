# Organization workflow template — Claude Code on @claude mentions.
#
# INFRASTRUCTURE PREREQUISITE: the official Claude GitHub App installed on the
# repository. The job authenticates to the Claude API by workload identity
# federation: its GitHub OIDC token is exchanged for a short-lived Claude API
# token under the organization's Anthropic federation rule, which accepts only
# repositories owned by LCV-Ideas-Software. The IDs in the body are
# identifiers, not credentials, so the repository needs no secret. Add an
# English CLAUDE.md at the repository root with the instructions Claude
# follows in that repository.
#
# Everything below this header follows the organization's canonical claude.yml,
# with the official anthropics/claude-code-action pinned by its full commit SHA
# and the organization's review defaults stated explicitly in the Action inputs:
# fork pull requests are never handled, untrusted pull-request authors are
# restricted, and the permission mode is acceptEdits. Its triggers name event
# types only, so it needs no default-branch placeholder. The checkout keeps its
# credential on purpose: the action fetches from origin before it installs its
# own token.

name: Claude Code

on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types:
      - created
  pull_request_review_comment:
    types:
      - created
  issues:
    types:
      - opened
  pull_request_review:
    types:
      - submitted

permissions: {}

jobs:
  claude:
    name: Claude Code
    # Pull requests opened by Dependabot are never handled, whatever the request.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.user.login != 'dependabot[bot]' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Official example permission set.
      pull-requests: write # Official example permission set.
      issues: write # Official example permission set.
      id-token: write # OIDC tokens for the Claude GitHub App and for workload identity federation.
      actions: read # Required for Claude to read CI results on PRs.
    steps:
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          # Workload identity federation: identifiers only, no stored credential.
          anthropic_federation_rule_id: fdrl_018JGbDBiFTVKbgHBBTWMU78
          anthropic_organization_id: 429b9383-2187-4013-b5b6-8b742c882601
          anthropic_service_account_id: svac_01GEajMWCurbGssFC1e2WsZ1
          anthropic_workspace_id: wrkspc_015xDNV1zNhuDmeuE8N6fRMK
          use_commit_signing: true
          # Organization review defaults, stated explicitly instead of relying on
          # the Action's own defaults. The Action declares these inputs as strings,
          # so each value is quoted.
          allow_fork_prs: "false"
          restrict_untrusted_prs: "true"
          claude_args: |
            --model opus
            --permission-mode acceptEdits
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "Pull request review behavior, applied whenever you are asked to review a pull request (for example '@claude review'): act only as a reviewer; do not edit files, commit or push. Before reading the patch or context files, use the existing Read tool to read only the checkout's .git/HEAD. For a symbolic HEAD under refs/heads/, read only that exact ref file under .git/ to recover the full checkout SHA. For detached HEAD, use the full SHA from HEAD. Stop without filing findings or publishing a completed review receipt unless the full checkout SHA can be verified and equals the full headRefOid captured from the pull request. Apply this policy only to events that identify an actual pull request; on a plain issue do not use pull-request or inline review tools. Before reading the patch, obtain and record the full head SHA with 'gh pr view <number> --json headRefOid'. Review only the changes this pull request introduces against its base branch: read them with 'gh pr diff <number>' and the description with 'gh pr view <number>' (the checkout is shallow, so do not rely on git history), and use the Read tool for surrounding context. Immediately after reading the diff, re-read the head with 'gh pr view <number> --json headRefOid' and stop if it changed. Report only actionable defects a maintainer would fix: correctness bugs, regressions, security problems, data loss and broken edge cases; no style or formatting nitpicks. Post every finding as its own inline review comment on the exact changed line with mcp__github_inline_comment__create_inline_comment, so each finding becomes a separate review thread. Start each inline comment with a priority badge and a bold short title on one line, exactly like '**<sub><sub>![P1 Badge](https://img.shields.io/badge/P1-orange?style=flat)</sub></sub>  Title**', using P0 (red) for release-blocking, P1 (orange) for urgent, P2 (yellow) for normal and P3 (green) for low, and always writing the image alt text as the priority followed by ' Badge' (for example 'P1 Badge'), never empty; then a blank line and one paragraph with the triggering scenario, the consequence and the fix; add a GitHub suggestion block when the fix is a small local replacement. Pass the recorded full reviewed SHA as commit_id to every mcp__github_inline_comment__create_inline_comment invocation. Immediately before each inline finding and immediately before publishing the completed tracking result, re-read the head with 'gh pr view <number> --json headRefOid' and stop if it changed; never emit a completed tracking result for a stale review. Do not repeat a finding that already has an open review thread. In the tracking comment write only '### 💡 Claude Review', the reviewed head commit as '**Reviewed commit:** ' followed by the first 10 characters of its SHA in backticks, and either the number of findings posted or 'No major issues found.'"
