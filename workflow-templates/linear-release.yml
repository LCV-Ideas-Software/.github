# Organization workflow template — Linear release synchronization.
#
# INFRASTRUCTURE PREREQUISITE: an environment named `linear-release` holding the
# environment secret `LINEAR_ACCESS_KEY`. Without it the job fails on its first
# run. The secret lives in a dedicated environment so it is never exposed to a
# job that does not need it.
#
# This starter records a release on every push to the default branch. A
# repository that deploys with a workflow named "Deploy" uses the companion
# starter "Linear Release after Deploy" instead, which records a release only
# after a successful deployment.

name: Linear Release

on:
  push:
    branches:
      - $default-branch

permissions: {}

# The group serializes release creation. The `queue: max` property lets up to
# 100 runs wait as pending, instead of the default `single`, which cancels and
# replaces the pending run; beyond 100, additional runs are cancelled. It cannot
# be combined with `cancel-in-progress: true`, which is why that key is absent.
concurrency:
  group: linear-release-${{ github.ref }}
  queue: max

jobs:
  linear_release:
    name: Linear Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: linear-release
    permissions:
      contents: read # The CLI reads commit history to associate issues with the release.
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history: the CLI scans commits since the last release.
          persist-credentials: false

      # Linear's official action, pinned to the full-length SHA of v0.17.2. The
      # CLI version is selected explicitly so a future rebuild of the action
      # cannot change the tool that runs. The installer verifies the downloaded
      # CLI against a published SHA-256 checksum before executing it.
      #
      # Fail-closed: an outage, a CLI error or an expired secret leaves the run
      # red instead of hiding a divergence between GitHub and Linear.
      - name: Create Linear release with the official action
        id: linear_release
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          cli_version: v0.17.2
