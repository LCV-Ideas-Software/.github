# Organization workflow template — CodeQL code scanning.
#
# AFTER CREATING THIS WORKFLOW, BEFORE OPENING THE PULL REQUEST:
#   1. Install the lock tool once: `gh extension install github/gh-actions-lock`
#   2. Run `gh actions-lock` in the repository root.
#   3. Commit the regenerated `.github/workflows/actions.lock` IN THE SAME pull
#      request. The Enterprise required workflow "Validate actions.lock" reads
#      every file under .github/workflows and fails the pull request while the
#      actions used below are not recorded in the lockfile. A full-length SHA
#      pin does not replace the lockfile entry.
#
# Adjust the language matrix to the languages this repository actually contains,
# and move the cron minute so repositories do not all scan at the same moment.

name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
  pull_request:
    branches:
      - $default-branch
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "29 7 * * 2"

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Required by CodeQL to inspect workflow-run metadata.
      contents: read # Required to check out the repository under analysis.
      security-events: write # Required to publish CodeQL analysis results.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          dependency-caching: true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
