# Organization workflow template — GitHub native auto-merge for Dependabot.
#
# INFRASTRUCTURE PREREQUISITE: a Dependabot secret named
# DEPENDABOT_AUTOMERGE_TOKEN holding a fine-grained personal access token with
# "Contents" and "Pull requests" write access to this repository. Workflows
# triggered by Dependabot see Dependabot secrets only, never Actions secrets.
# A personal token is used on purpose: a merge performed with the GITHUB_TOKEN
# would not trigger the default-branch workflows (deploy, release, Pages).
#
# This workflow runs no Action and checks out nothing. GitHub performs the
# squash merge only after every effective rule and required check passes.

name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Enable auto-merge for Dependabot
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable GitHub native auto-merge with squash
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
