# Organization workflow template — GitHub native auto-merge for Dependabot.
#
# INFRASTRUCTURE PREREQUISITE: a Dependabot secret named
# DEPENDABOT_AUTOMERGE_TOKEN holding a fine-grained personal access token with
# "Contents", "Pull requests" and "Workflows" read and write access to this
# repository. Workflows is required because Dependabot's github-actions
# updates change files under .github/workflows. Workflows triggered by
# Dependabot see Dependabot secrets only, never Actions secrets, and a manual
# re-run keeps that; a new event initiated by a person receives Actions secrets
# and finds no token, and so does a repository where the secret was never
# configured: both fail visibly.
# A personal token is used on purpose: a merge performed with the built-in
# Actions token would not trigger the default-branch workflows (deploy,
# release, Pages).
#
# This workflow runs no Action and checks out nothing. GitHub performs the
# squash merge only after every effective rule and required check passes.

name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - $default-branch

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Enable auto-merge for Dependabot
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable GitHub native auto-merge with squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_AUTOMERGE_TOKEN is not available in this run: either the Dependabot secret is not configured, or this event was initiated by a person and received Actions secrets (a manual re-run of a Dependabot-initiated run keeps that run's Dependabot secrets, so the re-run reaches this message only when the secret is not configured). Auto-merge is armed again on the next Dependabot synchronization or after '@dependabot recreate'."
            exit 1
          fi
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
