<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" role="img" aria-label="Section divider">
  <title>Section divider</title>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0" />
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="65%" stop-color="#34d399" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="900" height="2" rx="1" fill="#94a3b8" fill-opacity="0.25" />
  <rect x="0" y="0" width="900" height="6" rx="3" fill="url(#sweep)" />
</svg>
