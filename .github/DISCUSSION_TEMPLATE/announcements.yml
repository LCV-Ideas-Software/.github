title: "[Anúncio] "
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário somente para anúncios que possam ser apresentados integralmente ao
        público. Não publique segredos, credenciais, URLs privadas, identificadores reais de contas
        ou infraestrutura, nem dados de trabalho sensíveis.
  - type: input
    id: reference
    attributes:
      label: Referência pública
      description: Informe uma versão, PR, Issue ou URL pública quando houver.
  - type: textarea
    id: highlights
    attributes:
      label: Destaques
    validations:
      required: true
  - type: textarea
    id: breaking
    attributes:
      label: Impacto público
      description: Explique mudanças de comportamento ou escreva "nenhum" quando não houver.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verificação
      description: Indique os gates aprovados e a evidência de produção aplicável.
    validations:
      required: true
