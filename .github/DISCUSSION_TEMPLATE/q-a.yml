title: "[Pergunta] "
body:
  - type: markdown
    attributes:
      value: |
        Use Q&A para conhecimento durável sobre este repositório ou sobre a governança da
        organização. Redija dados sensíveis e identificadores operacionais privados.
  - type: textarea
    id: question
    attributes:
      label: Pergunta
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto e tentativas
      description: Registre arquivos consultados, evidências e hipóteses já descartadas.
    validations:
      required: true
