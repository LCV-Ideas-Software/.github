version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
      exclude:
        - "*"
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"
      codeql-action-security-updates:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
      github-actions-non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: increase
    groups:
      public-format-tooling:
        patterns:
          - "prettier"
        update-types:
          - "minor"
          - "patch"
      cloudflare-tooling:
        patterns:
          - "wrangler"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/workers/github-slack-relay"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: increase
    groups:
      github-slack-relay-tooling:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
