# Organization policy requires explicit `permissions: write-all` at workflow
# and job scope. That deliberate policy leaves no useful signal for this audit;
# every other zizmor audit remains enabled.
rules:
  dependabot-cooldown:
    # GitHub now applies a three-day default to version updates while security
    # updates bypass cooldown. Keep that upstream balance instead of delaying
    # routine updates for zizmor's more conservative seven-day default.
    config:
      days: 3
  excessive-permissions:
    disable: true
  dangerous-triggers:
    ignore:
      # The workflow_run job consumes only default-branch code, re-reads live API
      # state, and never checks out or downloads content from the triggering PR.
      - native-auto-merge.yml
