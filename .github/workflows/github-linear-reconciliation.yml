name: GitHub Linear Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - ".npmrc"
      - ".github/workflows/github-linear-reconciliation.yml"
      - "THIRDPARTY.md"
      - ".node-version"
      - "docs/GITHUB_LINEAR_RECONCILIATION.md"
      - "package-lock.json"
      - "package.json"
      - "tools/github-linear-reconciler/**"
  pull_request:
    branches:
      - main
    paths:
      - ".npmrc"
      - ".github/workflows/github-linear-reconciliation.yml"
      - "THIRDPARTY.md"
      - ".node-version"
      - "docs/GITHUB_LINEAR_RECONCILIATION.md"
      - "package-lock.json"
      - "package.json"
      - "tools/github-linear-reconciler/**"
  merge_group:
    types:
      - checks_requested

permissions: {}

concurrency:
  group: github-linear-reconciliation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify read-only reconciler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify the reconciler without live credentials
        run: npm run test:github-linear-reconciler
