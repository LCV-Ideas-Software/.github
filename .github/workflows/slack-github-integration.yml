name: Slack GitHub Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/slack-github-integration.yml"
      - "slack/github-integration/**"
      - "scripts/slack-workflow-monitor.mjs"
      - "scripts/slack-workflow-monitor.test.mjs"
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "12,27,42,57 * * * *"
    - cron: "17 7 * * *"
      timezone: "Etc/GMT+3"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run against the production Slack app
        required: true
        default: monitor
        type: choice
        options:
          - monitor

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: slack-github-integration-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Slack workflow app
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule == '17 7 * * *'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Deno 2.9.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Test Slack workflow monitor
        run: node --test scripts/slack-workflow-monitor.test.mjs

      - name: Check Slack workflow app
        working-directory: slack/github-integration
        run: |
          set -euo pipefail
          if grep -R -n -E 'GITHUB_(ACTIVITY|ALERTS)_CHANNEL_ID|workflows:[[:space:]]*\[\]|"groups:(read|write)"' \
            manifest.ts workflows; then
            echo "::error::Slack app still contains bootstrap-only placeholders, an empty workflow list, or a provisioning scope."
            exit 1
          fi
          deno task --frozen check

      - name: Audit Slack workflow app dependencies
        working-directory: slack/github-integration
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.token || '' }}
        run: deno task --frozen audit

  monitor:
    name: Monitor Slack workflow execution
    if: >-
      vars.SLACK_GITHUB_INTEGRATION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' &&
      github.event.schedule == '12,27,42,57 * * * *') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'monitor'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: slack-production
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Test Slack workflow monitor
        run: node --test scripts/slack-workflow-monitor.test.mjs

      - name: Fail closed on recent Slack workflow errors
        env:
          SLACK_APP_ID: ${{ vars.SLACK_GITHUB_INTEGRATION_APP_ID }}
          SLACK_RELAY_SIGNING_ACTIVE_SLOT: next
          SLACK_RELAY_SIGNING_SECRET_NEXT: ${{ secrets.SLACK_RELAY_SIGNING_SECRET }}
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_TEAM_ID: ${{ vars.SLACK_WORKSPACE_ID }}
        run: node scripts/slack-workflow-monitor.mjs
