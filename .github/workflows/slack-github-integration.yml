name: Slack GitHub Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/slack-github-integration.yml"
      - "slack/github-integration/**"
      - "scripts/slack-workflow-monitor.mjs"
      - "scripts/slack-workflow-monitor.test.mjs"
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "12,27,42,57 * * * *"
    - cron: "17 7 * * *"
      timezone: "Etc/GMT+3"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run against the production Slack app
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - monitor

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: slack-github-integration-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Slack workflow app
    if: github.event_name != 'schedule' || github.event.schedule == '17 7 * * *'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Deno 2.9.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Test Slack workflow monitor
        run: node --test scripts/slack-workflow-monitor.test.mjs

      - name: Check Slack workflow app
        working-directory: slack/github-integration
        run: |
          set -euo pipefail
          if grep -R -n -E 'GITHUB_(ACTIVITY|ALERTS)_CHANNEL_ID|workflows:[[:space:]]*\[\]|"groups:(read|write)"|"chat:write\.public"' \
            manifest.ts workflows; then
            echo "::error::Slack app still contains bootstrap-only placeholders, an empty workflow list, or a scope outside the fixed private-channel design."
            exit 1
          fi
          deno task --frozen check

      - name: Audit Slack workflow app dependencies
        working-directory: slack/github-integration
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.token || '' }}
        run: deno task --frozen audit

  deploy:
    name: Deploy Slack workflow app
    if: >-
      vars.SLACK_GITHUB_INTEGRATION_ENABLED == 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'deploy' &&
      github.ref == 'refs/heads/main'))
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: slack-production
    steps:
      - name: Checkout verified revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Deno 2.9.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5

      - name: Install verified Slack CLI 4.6.0
        shell: bash
        env:
          SLACK_CLI_ASSET: slack_cli_4.6.0_linux_64-bit.tar.gz
          SLACK_CLI_SHA256: 2863e7721af346caef72be7dc3be2a520db7207de08a440d040a6ec1378baeca
          SLACK_CLI_VERSION: 4.6.0
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${SLACK_CLI_ASSET}"
          install_root="${RUNNER_TEMP}/slack-cli-${SLACK_CLI_VERSION}"
          asset_url="https://github.com/slackapi/slack-cli/releases/download/v${SLACK_CLI_VERSION}/${SLACK_CLI_ASSET}"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "$asset_url"
          printf '%s  %s\n' "$SLACK_CLI_SHA256" "$archive" \
            | sha256sum --check --strict -

          mkdir -p "$install_root"
          tar --extract --gzip \
            --file "$archive" \
            --directory "$install_root" \
            --no-same-owner \
            --no-same-permissions \
            LICENSE bin/slack
          test -f "$install_root/bin/slack"
          chmod 0755 "$install_root/bin/slack"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          version_output=$("$install_root/bin/slack" version)
          printf '%s\n' "$version_output"
          if [[ "$version_output" != *"v${SLACK_CLI_VERSION}"* ]]; then
            echo "::error::The verified Slack CLI asset did not report the expected version."
            exit 1
          fi

      - name: Deploy without exposing webhook triggers
        working-directory: slack/github-integration
        env:
          SLACK_APP_ID: ${{ vars.SLACK_GITHUB_INTEGRATION_APP_ID }}
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_TEAM_ID: ${{ vars.SLACK_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          : "${SLACK_APP_ID:?Missing SLACK_GITHUB_INTEGRATION_APP_ID}"
          : "${SLACK_SERVICE_TOKEN:?Missing SLACK_SERVICE_TOKEN}"
          : "${SLACK_TEAM_ID:?Missing SLACK_WORKSPACE_ID}"
          slack deploy \
            --app "$SLACK_APP_ID" \
            --team "$SLACK_TEAM_ID" \
            --token "$SLACK_SERVICE_TOKEN" \
            --hide-triggers \
            --skip-update

      - name: Verify the exact protected production trigger inventory
        working-directory: slack/github-integration
        env:
          ACTIVITY_TRIGGER_ID: ${{ vars.SLACK_GITHUB_ACTIVITY_TRIGGER_ID }}
          ALERT_TRIGGER_ID: ${{ vars.SLACK_GITHUB_ALERT_TRIGGER_ID }}
          SLACK_APP_ID: ${{ vars.SLACK_GITHUB_INTEGRATION_APP_ID }}
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_TEAM_ID: ${{ vars.SLACK_WORKSPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SLACK_APP_ID:?Missing SLACK_GITHUB_INTEGRATION_APP_ID}"
          : "${SLACK_SERVICE_TOKEN:?Missing SLACK_SERVICE_TOKEN}"
          : "${SLACK_TEAM_ID:?Missing SLACK_WORKSPACE_ID}"
          for trigger_id in "$ACTIVITY_TRIGGER_ID" "$ALERT_TRIGGER_ID"; do
            if [[ ! "$trigger_id" =~ ^Ft[A-Z0-9]{8,}$ ]]; then
              echo "::error::A protected Slack webhook trigger ID is missing or malformed."
              exit 1
            fi
          done
          if [[ "$ACTIVITY_TRIGGER_ID" == "$ALERT_TRIGGER_ID" ]]; then
            echo "::error::The activity and alert trigger IDs must be distinct."
            exit 1
          fi

          if [[ ! "$SLACK_APP_ID" =~ ^A[A-Z0-9]{8,}$ ]]; then
            echo "::error::The protected Slack app ID is malformed."
            exit 1
          fi

          # The human-facing list/info commands print bearer webhook URLs and
          # omit workflow mappings. Stream the raw API response directly to a
          # fail-closed validator; never persist or log the response.
          inventory_error="${RUNNER_TEMP}/slack-trigger-inventory.err"
          request_body="$(printf '{\"app_id\":\"%s\",\"limit\":100}' "$SLACK_APP_ID")"
          if ! slack api workflows.triggers.list \
            --token "$SLACK_SERVICE_TOKEN" \
            --json "$request_body" \
            --no-color \
            --skip-update \
            2>"$inventory_error" \
            | deno run \
              --allow-env=ACTIVITY_TRIGGER_ID,ALERT_TRIGGER_ID,SLACK_APP_ID \
              scripts/verify_trigger_inventory.ts; then
            rm -f "$inventory_error"
            echo "::error::Slack could not verify the exact production trigger inventory."
            exit 1
          fi
          rm -f "$inventory_error"

  monitor:
    name: Monitor Slack workflow execution
    if: >-
      vars.SLACK_GITHUB_INTEGRATION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' &&
      github.event.schedule == '12,27,42,57 * * * *') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'monitor'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: slack-production
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Test Slack workflow monitor
        run: node --test scripts/slack-workflow-monitor.test.mjs

      - name: Fail closed on recent Slack workflow errors
        env:
          SLACK_APP_ID: ${{ vars.SLACK_GITHUB_INTEGRATION_APP_ID }}
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_TEAM_ID: ${{ vars.SLACK_WORKSPACE_ID }}
        run: node scripts/slack-workflow-monitor.mjs
