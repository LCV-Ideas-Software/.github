name: Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages.yml"
      - "package-lock.json"
      - "package.json"
      - "site/**"
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"
permissions: {}
concurrency:
  group: cloudflare-pages-org-site
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      contents: read
    name: Deploy org-site
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: |
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency signatures and advisories
        run: |
          npm audit signatures
          npm audit --audit-level=low
          expected_wrangler="$(node -p "require('./package.json').devDependencies.wrangler")"
          test "$(./node_modules/.bin/wrangler --version)" = "$expected_wrangler"
      - name: Check public page formatting
        run: npm run format:public:check
      - name: Deploy site to Cloudflare Pages
        run: |
          ./node_modules/.bin/wrangler pages deploy site --project-name=org-site --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    timeout-minutes: 30
