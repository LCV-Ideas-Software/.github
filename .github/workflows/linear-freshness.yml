name: Linear Freshness
# Vigia de frescor das release pipelines do Linear (issue #207): a sincronização
# de releases é best-effort (continue-on-error) por desenho, então uma falha
# persistente — segredo expirado, digest divergente, indisponibilidade — para as
# releases EM SILÊNCIO. Este vigia fecha o ângulo morto: compara o último push em
# main de cada repositório com a última release da pipeline correspondente e
# FALHA RUIDOSAMENTE quando a pipeline ficou para trás além da tolerância. A
# falha deste workflow é uma falha comum de workflow — exatamente o que o relay
# GitHub→Slack já observa; nenhuma fiação nova de alerta é necessária.
#
# Vive centralizado neste repositório, deliberadamente FORA dos repositórios com
# auto-tag/publicação que varrem todos os runs de um SHA: um vigia que falha não
# pode morar onde a falha dele bloqueia portões alheios.
on:
  schedule:
    - cron: "0 12 * * 1" # segunda-feira, 09:00 em Brasília
  workflow_dispatch:
# Política enterprise (Discussion #150): sem write-all. Conjunto vazio no escopo do
# workflow e grant mínimo declarado no job.
permissions: {}
concurrency:
  group: linear-freshness
  cancel-in-progress: true
jobs:
  freshness:
    name: Linear Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Política zizmor da casa: secret só é lido dentro de environment dedicado.
    # LINEAR_READ_KEY é uma Personal API key SOMENTE-LEITURA do Linear (verificado:
    # mutações são recusadas), usada apenas para consultar a última release de
    # cada pipeline.
    environment: linear-observability
    permissions:
      contents: read # leitura dos commits de main dos repositórios públicos da organização
    steps:
      # Sem checkout: o vigia é só duas consultas de API comparadas.
      - name: Comparar último push de main com a última release de cada pipeline
        env:
          LINEAR_READ_KEY: ${{ secrets.LINEAR_READ_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOLERANCIA_HORAS: "48"
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone, timedelta

          TOL = timedelta(hours=int(os.environ["TOLERANCIA_HORAS"]))
          AGORA = datetime.now(timezone.utc)

          def linear(query):
              req = urllib.request.Request("https://api.linear.app/graphql",
                  data=json.dumps({"query": query}).encode(),
                  headers={"Authorization": os.environ["LINEAR_READ_KEY"],
                           "Content-Type": "application/json"})
              d = json.loads(urllib.request.urlopen(req).read().decode())
              if "errors" in d:
                  print(f"::error::Linear API: {str(d['errors'])[:200]}"); sys.exit(1)
              return d["data"]

          def github(path):
              req = urllib.request.Request(f"https://api.github.com{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"})
              return json.loads(urllib.request.urlopen(req).read().decode())

          def ts(s):
              return datetime.fromisoformat(s.replace("Z", "+00:00"))

          d = linear("""{ releasePipelines(first: 20) { nodes { name
                releases(first: 1) { nodes { createdAt } } } } }""")
          pipelines = {p["name"]: (ts(p["releases"]["nodes"][0]["createdAt"])
                                   if p["releases"]["nodes"] else None)
                       for p in d["releasePipelines"]["nodes"]}

          # .github-private é Internal: o GITHUB_TOKEN deste repositório não o lê.
          # Exceção documentada; a pipeline dele fica fora do vigia.
          MAPA = {".github-org": ".github"}  # nome da pipeline -> repositório
          atrasadas = []
          for nome, ultima_release in sorted(pipelines.items()):
              if nome == ".github-private":
                  print(f"{nome:<20} (Internal — fora do vigia, exceção documentada)")
                  continue
              repo = MAPA.get(nome, nome)
              c = github(f"/repos/LCV-Ideas-Software/{repo}/commits?per_page=1")
              push = ts(c[0]["commit"]["committer"]["date"])
              if ultima_release is None:
                  atrasadas.append((nome, "pipeline sem nenhuma release"))
                  print(f"{nome:<20} SEM RELEASE — push {push:%d/%m %H:%M}")
                  continue
              atraso = push - ultima_release
              estado = "ATRASADA" if atraso > TOL else "ok"
              if atraso > TOL:
                  atrasadas.append((nome, f"main {atraso} à frente da pipeline"))
              print(f"{nome:<20} {estado:<9} push {push:%d/%m %H:%M}  release {ultima_release:%d/%m %H:%M}")

          if atrasadas:
              for nome, motivo in atrasadas:
                  print(f"::error::pipeline {nome}: {motivo} (tolerância {TOL})")
              print(f"\n{len(atrasadas)} pipeline(s) atrasada(s): possível segredo expirado, "
                    f"digest divergente, indisponibilidade do Linear — ou Deploy falhando há dias "
                    f"nos repositórios da fase 2 (também merece atenção).")
              sys.exit(1)
          print("\ntodas as pipelines monitoradas estão frescas")
          PY
