name: Zizmor

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: write-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: zizmor-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this reusable workflow's immutable tooling source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lcv-zizmor-tooling
          sparse-checkout: .github/zizmor/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout repository to audit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .lcv-audit-target
          persist-credentials: false

      - name: Build the digest-pinned zizmor runtime
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --no-cache \
            --file .lcv-zizmor-tooling/.github/zizmor/Dockerfile \
            --tag lcv-zizmor:audited \
            .lcv-zizmor-tooling/.github/zizmor

      - name: Analyze workflows and capture the enforcement result
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          zizmor=(
            docker run
            --rm
            --network none
            --read-only
            --cap-drop=ALL
            --security-opt no-new-privileges
            --pids-limit 128
            --volume "${GITHUB_WORKSPACE}/.lcv-audit-target:/workspace:ro"
            --workdir /workspace
            lcv-zizmor:audited
            --offline \
            --persona=auditor \
            --strict-collection \
            --collect=all \
            --color=never
          )

          # SARIF intentionally exits zero even when findings exist. Capture the
          # normal formatter's exit status as the independent enforcement gate,
          # while still producing SARIF before the job is allowed to fail.
          set +e
          "${zizmor[@]}" . 2>&1 | tee "${RUNNER_TEMP}/zizmor-findings.txt"
          zizmor_exit="${PIPESTATUS[0]}"
          set -e

          "${zizmor[@]}" \
            --format=sarif \
            . > "${RUNNER_TEMP}/zizmor-results.sarif"
          test -s "${RUNNER_TEMP}/zizmor-results.sarif"
          if [[ ! "$zizmor_exit" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid zizmor exit code: $zizmor_exit" >&2
            exit 1
          fi
          printf 'exit_code=%s\n' "$zizmor_exit" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ runner.temp }}/zizmor-results.sarif
          checkout_path: ${{ github.workspace }}/.lcv-audit-target
          category: zizmor

      - name: Enforce zero active zizmor findings
        shell: bash
        env:
          ZIZMOR_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ ! "$ZIZMOR_EXIT_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing or invalid zizmor enforcement result." >&2
            exit 1
          fi
          if [ "$ZIZMOR_EXIT_CODE" -ne 0 ]; then
            echo "::error::zizmor reported active findings; see the analyzer output and SARIF results." >&2
            exit "$ZIZMOR_EXIT_CODE"
          fi
          echo "zizmor reported zero active findings."
