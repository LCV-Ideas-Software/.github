# O vigia do ADR-002 §4: lê o /alerts/status e FALHA DE PROPÓSITO quando há
# coisa parada — o e-mail que o GitHub manda ao falhar é o aviso (decisão 2:
# o destinatário é a conta que editou este cron por último; contato@lcv.dev
# confirmado pelo operador em 16/08/2026).
#
# Restrições que são consequência, não preferência (ADR §6-D): o job NÃO tem
# `if:` e NÃO depende de `vars.*` — job pulado conclui como SUCESSO e não
# gera e-mail. O `environment:` presente abaixo é a exceção REFINADA: um
# environment dedicado e SEM regras de proteção não pula nem segura o job
# (é só escopo de segredo, exigido pela política do repo); o §6-D veta o
# que possa pular ou segurar, e proteção futura neste environment travaria
# o vigia — o aviso está no bloco do job.
#
# Uma condição só: a idade da pendente mais velha (limiar 3_600_000 ms,
# mantido em sincronia com WATCHDOG_MAX_PENDING_AGE_MS de
# workers/github-slack-relay/src/alerts/contract.ts — sincronia declarada,
# conferida no portão da Tarefa 8). E a decisão 3: DUAS verificações
# consecutivas sem resposta contam como problema. O estado entre execuções
# vive no cache do Actions COM CONTEÚDO ("ok"/"falha"), porque cache é
# imutável por chave: um marcador por existência ressuscitaria uma falha
# antiga depois de um sucesso e fabricaria "segunda consecutiva".
name: Alerts Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: alerts-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Watch alerts delivery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Environment DEDICADO e SEM regras de proteção: escopo do segredo
    # (exigência do zizmor/política do repo), nunca portão. A restrição do
    # ADR §6-D proíbe o que possa PULAR o job — environment desprotegido não
    # pula nem espera; se alguém um dia lhe acrescentar regras de proteção,
    # o vigia trava e o §6-D volta a valer contra a mudança.
    environment: alerts-watchdog
    steps:
      - name: Restore previous transport marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .watchdog-marker
          # run_attempt na chave (achado da revisão): re-execução mantém o
          # run_id e incrementa o attempt — sem ele, a chave imutável já
          # existiria e a re-execução não persistiria seu marcador,
          # fabricando ou perdendo o par de falhas consecutivas.
          key: alerts-watchdog-marker-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alerts-watchdog-marker-

      - name: Check alerts status
        env:
          STATUS_SECRET: ${{ secrets.ALERTS_STATUS_SECRET }}
          MAX_PENDING_AGE_MS: "3600000"
        run: |
          set -u
          anterior="ok"
          if [ -f .watchdog-marker ]; then
            anterior=$(cat .watchdog-marker)
          fi

          body=""
          http_code=0
          # Transporte: uma tentativa por execução; a política de "duas
          # consecutivas" (decisão 3) vive no marcador, não em retries.
          if response=$(curl --silent --show-error --max-time 30 \
              --write-out $'\n%{http_code}' \
              --header "x-alerts-status-secret: ${STATUS_SECRET}" \
              "https://github-slack-alerts.lcv.workers.dev/alerts/status"); then
            http_code=$(printf '%s' "$response" | tail -n 1)
            body=$(printf '%s' "$response" | sed '$d')
          fi

          # 404 é a JANELA DE ROLLOUT, não falha (achado da revisão): no
          # primeiro merge, o agendamento ativa antes de o deploy serial
          # (verify -> prove_remote_d1 -> deploy, até ~60 min) publicar a
          # rota — o Worker antigo devolve 404 e dois tiques fabricariam o
          # e-mail de alarme. Depois do deploy, /alerts/status nunca
          # devolve 404 (401/200/503), e remover a rota exigiria outro PR.
          # O marcador fica INTOCADO: neutro, nem ok nem falha.
          if [ "$http_code" = "404" ]; then
            echo "Rota /alerts/status ainda não implantada (HTTP 404); janela de rollout, sem contar falha."
            exit 0
          fi

          if [ "$http_code" != "200" ]; then
            printf 'falha' > .watchdog-marker
            if [ "$anterior" = "falha" ]; then
              echo "::error::Segunda verificação consecutiva sem resposta do Worker (HTTP ${http_code}). Decisão 3 do ADR-002: conta como problema."
              exit 1
            fi
            echo "Primeira falha de transporte (HTTP ${http_code}); a segunda consecutiva falha o job."
            exit 0
          fi

          # Um 200 com corpo malformado NÃO é saúde (achado da revisão: só
          # o código HTTP era validado, e um JSON quebrado podia concluir
          # sucesso). Corpo que não parseia, ou idade que não é número nem
          # null, conta como falha de transporte — entra na política das
          # duas consecutivas.
          # has() é obrigatório (achado da revisão): sem ele, um corpo {}
          # avaliava o campo AUSENTE como null e resetava o marcador — a
          # ausência do campo tem de cair no ramo de corpo ilegível, não
          # passar por "nenhuma pendente".
          if ! age=$(printf '%s' "$body" | jq -er 'if has("oldest_pending_age_ms") then (.oldest_pending_age_ms | if . == null then "null" else tostring end) else empty end' 2>/dev/null); then
            printf 'falha' > .watchdog-marker
            if [ "$anterior" = "falha" ]; then
              echo "::error::Segunda resposta consecutiva ilegível do /alerts/status. Decisão 3 do ADR-002: conta como problema."
              exit 1
            fi
            echo "Resposta 200 com corpo ilegível; a segunda consecutiva falha o job."
            exit 0
          fi
          case "$age" in
            null|*[!0-9]*)
              if [ "$age" != "null" ]; then
                printf 'falha' > .watchdog-marker
                if [ "$anterior" = "falha" ]; then
                  echo "::error::Segunda idade consecutiva não numérica ('${age}'). Conta como problema."
                  exit 1
                fi
                echo "Idade não numérica ('${age}'); a segunda consecutiva falha o job."
                exit 0
              fi
              ;;
          esac

          printf 'ok' > .watchdog-marker
          echo "status: ${body}"

          pending=$(printf '%s' "$body" | jq -r '.pending // "?"')
          if [ "$age" = "null" ]; then
            echo "Nenhuma linha pendente (${pending} pendentes)."
            exit 0
          fi
          if [ "$age" -gt "$MAX_PENDING_AGE_MS" ]; then
            echo "::error::Alerta parado há ${age} ms (limiar ${MAX_PENDING_AGE_MS} ms), ${pending} pendente(s). O canal #github-alerts pode estar sem entrega — ADR-002 §4."
            exit 1
          fi
          echo "Pendente mais velha com ${age} ms (< ${MAX_PENDING_AGE_MS} ms); recuperação normal em curso."

      - name: Save transport marker
        # Roda inclusive quando o passo anterior FALHOU: a falha de idade
        # também grava "ok" no transporte? Não — o marcador é escrito pelo
        # próprio passo de verificação antes de qualquer exit; aqui só se
        # persiste o arquivo que ele deixou.
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .watchdog-marker
          key: alerts-watchdog-marker-${{ github.run_id }}-${{ github.run_attempt }}
