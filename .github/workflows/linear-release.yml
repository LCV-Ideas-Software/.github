name: Linear Release
on:
  push:
    branches:
      - main

permissions: {}

# The continuous Linear pipeline records repository commits rather than a
# numbered artifact. Every run waits in the queue without replacing an older
# pending run.
concurrency:
  group: linear-release-${{ github.ref }}
  queue: max

jobs:
  linear_release:
    name: Linear Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: linear-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fail-closed mirror: a Linear outage fails this workflow so post-merge
      # verification and the normal workflow alerting surface the interruption.
      #
      # Official Linear action, pinned to the release commit of v0.18.0, with
      # the CLI version selected explicitly. The installer verifies the
      # downloaded CLI against a published SHA-256 checksum before executing it.
      - name: Create Linear release with the official action
        id: linear_release
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          cli_version: v0.18.0
