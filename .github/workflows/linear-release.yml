# This workflow is managed by gh actions-lock.

name: Linear Release
on:
  push:
    branches:
      - main

permissions: {}

# The continuous Linear pipeline records repository commits rather than a
# numbered artifact. Every run waits in the queue without replacing an older
# pending run.
concurrency:
  group: linear-release-${{ github.ref }}
  queue: max

jobs:
  linear_release:
    name: Linear Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: linear-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fail-closed mirror: a Linear outage fails this workflow so post-merge
      # verification and the normal workflow alerting surface the interruption.
      #
      # The official Action is pinned to the commit for v0.16.0 and selects the
      # same CLI version. Its installer still downloads the CLI without
      # authenticating the bytes; the accepted upstream gap is tracked in
      # linear/linear-release-action#59 and documented in THIRDPARTY.md.
      - name: Create Linear release with the official action
        id: linear_release
        uses: linear/linear-release-action@0a25abab892a91062ebf42260dbb2ce6277aa205 # v0.16.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          cli_version: v0.16.0
