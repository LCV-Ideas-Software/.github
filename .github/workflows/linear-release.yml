# This workflow is managed by gh actions-lock.

name: Linear Release
on:
  push:
    branches:
      - main

permissions: {}

# The continuous Linear pipeline records repository commits rather than a
# numbered artifact. Every run waits in the queue without replacing an older
# pending run.
concurrency:
  group: linear-release-${{ github.ref }}
  queue: max

jobs:
  linear_release:
    name: Linear Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: linear-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fail-closed mirror: a Linear outage fails this workflow so post-merge
      # verification and the normal workflow alerting surface the interruption.
      #
      # Action oficial da Linear, pinada ao commit da release v0.17.1, com a
      # versão do CLI selecionada explicitamente. Desde a v0.16.1 o instalador
      # verifica o CLI baixado contra um checksum SHA-256 publicado antes de
      # executá-lo, fechando a lacuna rastreada em
      # linear/linear-release-action#59.
      - name: Create Linear release with the official action
        id: linear_release
        uses: linear/linear-release-action@3f31fcf14c110cc53579fcc3575a26d469c413b4 # v0.17.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          cli_version: v0.17.1
