name: Dependabot Automerge Core

on:
  workflow_call:
    inputs:
      controller_ref:
        description: Immutable commit of LCV-Ideas-Software/.github containing the controller.
        required: true
        type: string
      required_checks_json:
        description: JSON array of exact check-run names that must conclude success.
        required: true
        type: string
    secrets:
      LCV_AUTOMATION_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  process:
    name: Process Dependabot pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Load the trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LCV-Ideas-Software/.github
          ref: ${{ inputs.controller_ref }}
          path: .lcv-dependabot-controller
          persist-credentials: false

      - name: Process one guarded queue mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LCV_AUTOMATION_TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          REQUIRED_CHECKS_JSON: ${{ inputs.required_checks_json }}
        run: node .lcv-dependabot-controller/scripts/dependabot-automerge-controller.mjs

concurrency:
  group: dependabot-automerge-${{ github.repository }}
  cancel-in-progress: false
