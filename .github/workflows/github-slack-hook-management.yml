name: GitHub Slack Hook Management

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Organization webhook operation
        required: true
        type: choice
        options:
          - provision
          - activate
          - deactivate
          - ping

permissions: write-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-slack-webhook-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  manage:
    name: ${{ inputs.operation }} PAT-owned organization webhook
    if: github.ref == 'refs/heads/main'
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      HOOK_ID: ${{ vars['SLACK_RELAY_ORG_HOOK_ID'] }}
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Test organization webhook management controller
        run: node --test scripts/github-slack-hook-management.test.mjs

      - name: Validate required protected configuration
        env:
          OPERATION: ${{ inputs.operation }}
          TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::Required secret LCV_AUTOMATION_TOKEN is missing."
            exit 1
          fi
          if [[ ! "${OPERATION}" =~ ^(provision|activate|deactivate|ping)$ ]]; then
            echo "::error::Unsupported organization webhook operation."
            exit 1
          fi
          if [[ "${OPERATION}" != "provision" ]]; then
            if [[ -z "${HOOK_ID}" ]]; then
              echo "::error::Required variable SLACK_RELAY_ORG_HOOK_ID is missing."
              exit 1
            fi
            if [[ ! "${HOOK_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::SLACK_RELAY_ORG_HOOK_ID must be a positive integer."
              exit 1
            fi
          fi

      - name: Validate protected webhook secret for mutating operations
        if: inputs.operation != 'ping'
        env:
          WEBHOOK_SECRET: ${{ secrets.SLACK_RELAY_GITHUB_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_SECRET}" ]]; then
            echo "::error::Required secret SLACK_RELAY_GITHUB_WEBHOOK_SECRET is missing."
            exit 1
          fi

      - name: Manage mutating PAT-owned organization webhook operation
        if: inputs.operation != 'ping'
        env:
          OPERATION: ${{ inputs.operation }}
          TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.SLACK_RELAY_GITHUB_WEBHOOK_SECRET }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          WORKFLOW_REPO_OWNER: ${{ github.repository_owner }}
          WORKFLOW_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/github-slack-hook-management.mjs

      - name: Ping active PAT-owned organization webhook
        if: inputs.operation == 'ping'
        env:
          OPERATION: ${{ inputs.operation }}
          TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          WORKFLOW_REPO_OWNER: ${{ github.repository_owner }}
          WORKFLOW_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/github-slack-hook-management.mjs
