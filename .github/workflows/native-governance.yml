name: Native Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap_repository:
        description: Existing policy repository whose protected automation environment receives the central token.
        required: false
        default: ""
        type: string

permissions: write-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: native-governance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test native governance
    permissions: write-all # zizmor: ignore[excessive-permissions] Organization policy requires write-all.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Check governance and auditor syntax
        run: |
          node --check scripts/github-native-governance.mjs
          node --check scripts/github-actions-pin-audit.mjs
          node --check scripts/oss-advisory-watch.mjs

      - name: Test native governance and organization auditors
        run: >-
          node --test
          scripts/github-native-governance.test.mjs
          scripts/github-actions-pin-audit.test.mjs
          scripts/oss-advisory-watch.test.mjs

  reconcile:
    name: Reconcile native GitHub settings
    if: >-
      vars.LCV_NATIVE_RECONCILE_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.bootstrap_repository == ''))
    needs: test
    permissions: write-all # zizmor: ignore[excessive-permissions] Organization policy requires write-all.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-administration
    steps:
      - name: Checkout signed main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Reconcile native configuration only
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
        run: node scripts/github-native-governance.mjs

  bootstrap-automation-environment:
    name: Bootstrap protected native automation environment
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lcv-leo' &&
      github.actor_id == '268063598' &&
      inputs.bootstrap_repository != ''
    needs: test
    permissions: write-all # zizmor: ignore[excessive-permissions] Organization policy requires write-all.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-administration
    steps:
      - name: Checkout signed workflow source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Copy the central automation token into an exact protected environment
        shell: bash
        env:
          AUTOMATION_TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          GH_TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          TARGET_REPOSITORY: ${{ inputs.bootstrap_repository }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Target repository name is invalid." >&2
            exit 1
          fi
          jq -e \
            --arg organization "$ORGANIZATION_NAME" \
            --arg target "$TARGET_REPOSITORY" \
            '.organization == $organization and (.repositories | has($target))' \
            native-governance/policy.json >/dev/null

          full_repository="$ORGANIZATION_NAME/$TARGET_REPOSITORY"
          environment_json="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$full_repository/environments/dependabot-automation")"
          jq -e '
            .name == "dependabot-automation" and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true
          ' <<<"$environment_json" >/dev/null

          policies_json="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$full_repository/environments/dependabot-automation/deployment-branch-policies")"
          jq -e '
            .total_count == 1 and
            ([.branch_policies[] | {name, type}] == [{name: "main", type: "branch"}])
          ' <<<"$policies_json" >/dev/null

          printf '%s' "$AUTOMATION_TOKEN" | gh secret set LCV_AUTOMATION_TOKEN \
            --repo "$full_repository" \
            --env dependabot-automation

          secrets_json="$(gh secret list \
            --repo "$full_repository" \
            --env dependabot-automation \
            --json name,updatedAt)"
          jq -e '
            [ .[] | select(.name == "LCV_AUTOMATION_TOKEN") ] | length == 1
          ' <<<"$secrets_json" >/dev/null
          echo "Protected native automation environment bootstrapped for $full_repository."
