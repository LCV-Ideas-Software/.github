name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - ".node-version"
      - ".npmrc"
      - "package-lock.json"
      - "package.json"
      - "site/**"
  pull_request:
    branches:
      - main
    # `edited` covers a pull request retargeted to main; without it the
    # required check would not run until the next push.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read # Reads the existing Pages configuration through configure-pages.
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm

      - name: Install dependencies from the canonical npm registry
        run: |
          set -euo pipefail
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency signatures and advisories
        run: |
          set -euo pipefail
          npm audit signatures
          npm audit --audit-level=low

      - name: Verify public institutional boundary
        run: npm test

      - name: Check public page formatting
        run: npm run format:public:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    permissions:
      contents: read # Read the Rollouts reporter script.
      id-token: write # Issues the OIDC token consumed by deploy-pages.
      pages: write # Creates and monitors the GitHub Pages deployment.
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CHANGE_MONITOR_ENV: "github-pages"
      CHANGE_MONITOR_SOURCE: "https://github.com/${{ github.repository }}"
      DEPLOY_VERSION: "${{ github.sha }}"
      CHANGE_MONITOR_ACTOR: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
    steps:
      - name: Check out Rollouts reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/rollouts-reporter.sh
          sparse-checkout-cone-mode: false
      - name: Report Rollouts deploy start
        shell: bash
        env:
          CURSOR_API_KEY: "${{ secrets.CURSOR_API_KEY }}"
          CHANGE_MONITOR_SERVICE: "dot-github-pages"
        run: |
          ./.github/scripts/rollouts-reporter.sh bootstrap
          ./.github/scripts/rollouts-reporter.sh start
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Report Rollouts deploy result
        if: always()
        shell: bash
        env:
          CURSOR_API_KEY: "${{ secrets.CURSOR_API_KEY }}"
          CHANGE_MONITOR_SERVICE: "dot-github-pages"
          ROLLOUTS_OUTCOME: "${{ steps.deployment.outcome == 'skipped' && 'cancelled' || steps.deployment.outcome }}"
        run: |
          ./.github/scripts/rollouts-reporter.sh finish
