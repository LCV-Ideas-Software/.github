name: Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          artifact_count="$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(sum(1 for artifact in data.get("artifacts", []) if artifact.get("name") == "github-pages" and artifact.get("expired") is False))' <<< "$artifact_json")"
          if [ "$artifact_count" -eq 0 ]; then
            echo "::error::github-pages artifact not found for run ${GITHUB_RUN_ID}"
            exit 1
          fi
          if [ "$artifact_count" -gt 1 ]; then
            echo "::error::Multiple non-expired github-pages artifacts found for run ${GITHUB_RUN_ID}"
            exit 1
          fi
          artifact_id="$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(artifact["id"] for artifact in data.get("artifacts", []) if artifact.get("name") == "github-pages" and artifact.get("expired") is False))' <<< "$artifact_json")"

          oidc_response="$(
            curl -sSfL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          )"
          oidc_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")"

          deployment_json="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments" \
              -F artifact_id="$artifact_id" \
              -F pages_build_version="$GITHUB_SHA" \
              -F oidc_token="$oidc_token"
          )"
          deployment_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$deployment_json")"
          page_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("page_url", ""))' <<< "$deployment_json")"

          for attempt in {1..120}; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}" --jq '.status')"
            case "$status" in
              succeed)
                echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failed|errored|cancelled|deployment_failed|deployment_content_failed|deployment_endpoint_failed|deployment_endpoint_failed_permanent|deployment_attempt_error|deployment_lost)
                echo "::error::GitHub Pages deployment ${deployment_id} ended with status ${status}"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::Timed out waiting for GitHub Pages deployment ${deployment_id}"
          exit 1
    timeout-minutes: 30
