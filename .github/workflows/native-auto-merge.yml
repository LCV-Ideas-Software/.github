name: Native Auto-merge

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed
  pull_request:
  pull_request_target:
    types:
      - review_requested
  merge_group:
    types:
      - checks_requested

permissions: write-all

concurrency:
  group: native-auto-merge-${{ github.repository }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  candidate_tests:
    name: Test native auto-merge candidate
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    permissions: write-all
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax
        run: node --check native-auto-merge/main.mjs
      - name: Run focused tests
        run: node --test native-auto-merge/main.test.mjs native-auto-merge/reconciliation.test.mjs native-auto-merge/merge-group.test.mjs

  test:
    name: Test native auto-merge
    if: >-
      ${{
        always() &&
        (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      }}
    needs:
      - candidate_tests
    runs-on: ubuntu-latest
    permissions: write-all
    timeout-minutes: 30
    steps:
      - name: Reject unsuccessful candidate tests
        if: ${{ needs.candidate_tests.result != 'success' }}
        run: exit 1
      - name: Preserve the pull request required context
        if: ${{ github.event_name == 'pull_request' && needs.candidate_tests.result == 'success' }}
        run: echo "Candidate tests passed."
      - name: Enforce merge-group bot feedback
        if: ${{ github.event_name == 'merge_group' && needs.candidate_tests.result == 'success' }}
        uses: LCV-Ideas-Software/.github/native-auto-merge@84d2119d36e88869181cd80eeaea22ceee456fe6 # native-auto-merge/v2.1.0
        with:
          operation: merge-group-feedback-gate
          github_token: ${{ github.token }}
          event_repository: ${{ github.repository }}
          event_action: ${{ github.event.action }}
          merge_group_head_sha: ${{ github.event.merge_group.head_sha }}
          merge_group_base_ref: ${{ github.event.merge_group.base_ref }}
          merge_group_head_ref: ${{ github.event.merge_group.head_ref }}

  enable:
    name: Enable native auto-merge
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'review_requested' &&
          github.event.requested_reviewer.id == 175728472 &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    permissions: write-all
    environment: dependabot-automation
    timeout-minutes: 30
    steps:
      - name: Checkout trusted action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Enable GitHub native auto-merge
        if: ${{ github.event_name == 'workflow_run' }}
        uses: ./native-auto-merge
        with:
          automation_token: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          event_repository: ${{ github.event.repository.full_name }}
          workflow_name: ${{ github.event.workflow_run.name }}
          workflow_path: ${{ github.event.workflow_run.path }}
          workflow_display_title: ${{ github.event.workflow_run.display_title }}
          workflow_status: ${{ github.event.workflow_run.status }}
          workflow_event: ${{ github.event.workflow_run.event }}
          workflow_head_sha: ${{ github.event.workflow_run.head_sha }}
          workflow_actor_id: ${{ github.event.workflow_run.actor.id }}
          workflow_pull_requests: ${{ toJSON(github.event.workflow_run.pull_requests) }}
      - name: Reconcile requested Copilot review
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: ./native-auto-merge
        with:
          automation_token: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          event_repository: ${{ github.event.repository.full_name }}
          event_action: ${{ github.event.action }}
          pull_number: ${{ github.event.pull_request.number }}
          pull_head_sha: ${{ github.event.pull_request.head.sha }}
          pull_head_repository: ${{ github.event.pull_request.head.repo.full_name }}
          pull_base_ref: ${{ github.event.pull_request.base.ref }}
          requested_reviewer_id: ${{ github.event.requested_reviewer.id }}
          trigger_run_id: ${{ github.run_id }}
