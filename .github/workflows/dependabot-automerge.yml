name: Dependabot Automerge

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Dependency Review
      - Public Format
      - Socket Security
      - OpenSSF Scorecard
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: write
  statuses: read

jobs:
  dependabot-automerge:
    uses: ./.github/workflows/dependabot-automerge-core.yml
    with:
      controller_ref: ${{ github.sha }}
      required_checks_json: '["Dependency Review","Check index.html formatting","CodeQL","Socket Security: Project Report"]'
    secrets:
      LCV_AUTOMATION_TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
