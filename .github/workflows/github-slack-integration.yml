name: GitHub Slack Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-slack-integration.yml"
      - ".github/workflows/github-slack-webhook-redelivery.yml"
      - "docs/GITHUB_SLACK_INTEGRATION.md"
      - "scripts/github-slack-hook-audit.mjs"
      - "scripts/github-slack-hook-audit.test.mjs"
      - "scripts/github-slack-webhook-redelivery.mjs"
      - "scripts/github-slack-webhook-redelivery.test.mjs"
      - "scripts/slack-relay-d1-remote-proof.test.mjs"
      - "scripts/verify-slack-relay-d1-remote.mjs"
      - "workers/github-slack-relay/**"
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: github-slack-integration-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify GitHub Slack relay
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/github-slack-relay/package-lock.json

      - name: Install governance policy dependencies
        run: |
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install relay dependencies
        run: |
          test "$(npm config get registry --prefix workers/github-slack-relay)" = "https://registry.npmjs.org/"
          npm ci --prefix workers/github-slack-relay --ignore-scripts --no-audit --no-fund

      - name: Verify relay dependency signatures and advisories
        run: |
          npm audit signatures --prefix workers/github-slack-relay
          npm audit --prefix workers/github-slack-relay --audit-level=low
          expected_wrangler="$(node -p "require('./workers/github-slack-relay/package.json').devDependencies.wrangler")"
          test "$(workers/github-slack-relay/node_modules/.bin/wrangler --version)" = "$expected_wrangler"

      - name: Test organization webhook audit and recovery controllers
        run: >-
          node --test
          scripts/github-slack-hook-audit.test.mjs
          scripts/github-slack-webhook-redelivery.test.mjs
          scripts/slack-relay-d1-remote-proof.test.mjs

      - name: Verify Cloudflare relay
        working-directory: workers/github-slack-relay
        run: |
          npm run types:check
          npm run typecheck
          npm test
          npm run build

  prove_remote_d1:
    name: Prove remote D1 migration
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-production
    steps:
      - name: Establish the fail-closed remote proof deadline
        shell: bash
        run: |
          set -euo pipefail
          now_ms="$(date +%s%3N)"
          deadline_ms="$((now_ms + 59 * 60 * 1000))"
          printf 'REMOTE_PROOF_DEADLINE_MS=%s\n' "$deadline_ms" >> "$GITHUB_ENV"

      - name: Checkout verified revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Install relay dependencies
        run: |
          test "$(npm config get registry --prefix workers/github-slack-relay)" = "https://registry.npmjs.org/"
          npm ci --prefix workers/github-slack-relay --ignore-scripts --no-audit --no-fund

      - name: Verify relay dependency signatures and advisories
        run: |
          npm audit signatures --prefix workers/github-slack-relay
          npm audit --prefix workers/github-slack-relay --audit-level=low
          expected_wrangler="$(node -p "require('./workers/github-slack-relay/package.json').devDependencies.wrangler")"
          test "$(workers/github-slack-relay/node_modules/.bin/wrangler --version)" = "$expected_wrangler"

      - name: Prove durable inbox migration in disposable remote D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-slack-relay-d1-remote.mjs

  deploy:
    name: Deploy GitHub Slack relay
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: prove_remote_d1
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    steps:
      - name: Checkout verified revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Install relay dependencies
        run: |
          test "$(npm config get registry --prefix workers/github-slack-relay)" = "https://registry.npmjs.org/"
          npm ci --prefix workers/github-slack-relay --ignore-scripts --no-audit --no-fund

      - name: Verify relay dependency signatures and advisories
        run: |
          npm audit signatures --prefix workers/github-slack-relay
          npm audit --prefix workers/github-slack-relay --audit-level=low
          expected_wrangler="$(node -p "require('./workers/github-slack-relay/package.json').devDependencies.wrangler")"
          test "$(workers/github-slack-relay/node_modules/.bin/wrangler --version)" = "$expected_wrangler"

      # Ordem contract-phase (achado da revisão): o Worker novo tolera o
      # esquema antigo (ignora as tabelas legadas), mas o Worker antigo NÃO
      # tolera o novo (a 0011 dropa tabelas que ele consulta). Publicar o
      # código ANTES de migrar elimina a janela em que a revisão anterior
      # roda contra o esquema já contraído; migrações futuras nascem com o
      # código que as usa e toleram segundos de esquema anterior.
      - name: Deploy verified relay
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          workers/github-slack-relay/node_modules/.bin/wrangler deploy \
            --strict \
            --tag "$GITHUB_SHA" \
            --message "GitHub Actions ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --config workers/github-slack-relay/wrangler.jsonc

      - name: Apply durable inbox migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          workers/github-slack-relay/node_modules/.bin/wrangler d1 migrations apply github-slack-alerts-db \
            --remote \
            --config workers/github-slack-relay/wrangler.jsonc
