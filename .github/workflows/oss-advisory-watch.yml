name: OSS Advisory Watch

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: write-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: oss-advisory-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Scan locked organization dependencies with OSV-Scanner
    runs-on: ubuntu-latest
    permissions: write-all
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Validate the OSV result normalizer and Markdown renderer
        run: |
          set -euo pipefail
          node --check scripts/oss-advisory-watch.mjs
          node --test scripts/oss-advisory-watch.test.mjs

      - name: Gather lockfiles and their adjacent OSV configurations
        id: sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_ACTIVE_REPOSITORIES: "11"
          MIN_LOCKFILES: "17"
          ORG: LCV-Ideas-Software
        run: |
          set -euo pipefail
          scan_root=/tmp/osv-workspace
          provenance_ndjson=/tmp/osv-provenance.ndjson
          provenance_json=/tmp/osv-provenance.json
          active_repositories=/tmp/osv-active-repositories.tsv
          repositories_json=/tmp/osv-repositories.json
          lockfiles=/tmp/osv-lockfiles.tsv
          configurations=/tmp/osv-configurations.txt

          mkdir -p "$scan_root"
          : > "$provenance_ndjson"
          : > "$lockfiles"
          : > "$configurations"

          gh api --paginate --slurp \
            "orgs/$ORG/repos?type=all&per_page=100" > "$repositories_json"
          jq -r '
            flatten[]
            | select(.archived == false and .disabled == false)
            | [.name, .default_branch]
            | @tsv
          ' "$repositories_json" | tr -d '\r' > "$active_repositories"
          repository_count=$(wc -l < "$active_repositories")
          if [ "$repository_count" -lt "$MIN_ACTIVE_REPOSITORIES" ]; then
            echo "::error::Expected at least $MIN_ACTIVE_REPOSITORIES active repositories, found $repository_count."
            exit 1
          fi

          while IFS=$'\t' read -r repository default_branch; do
            if [ -z "$repository" ] || [ -z "$default_branch" ]; then
              echo "::error::GitHub returned incomplete active-repository metadata."
              exit 1
            fi
            encoded_branch=$(jq -rn --arg branch "$default_branch" '$branch | @uri')
            commit_sha=$(gh api "repos/$ORG/$repository/commits/$encoded_branch" --jq '.sha')
            if ! printf '%s' "$commit_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::GitHub returned an invalid default-branch commit for $repository."
              exit 1
            fi
            tree_file="/tmp/osv-tree-${repository}.json"
            gh api -X GET "repos/$ORG/$repository/git/trees/$commit_sha" \
              -f recursive=1 > "$tree_file"
            if [ "$(jq -r '.truncated' "$tree_file")" != "false" ]; then
              echo "::error::The recursive Git tree for $repository was truncated; refusing incomplete coverage."
              exit 1
            fi
            if jq -e '
              .tree[]
              | select(.type == "blob")
              | .path
              | select(
                  test("[\\t\\r\\n]")
                  or startswith("/")
                  or (split("/") | index("..") != null)
                )
            ' "$tree_file" > /dev/null; then
              echo "::error::The Git tree for $repository contains a path unsafe for the temporary scan tree."
              exit 1
            fi
            jq -r --arg repository "$repository" --arg commit_sha "$commit_sha" '
              .tree[]
              | select(.type == "blob")
              | .path as $path
              | select(
                  $path == "package-lock.json"
                  or ($path | endswith("/package-lock.json"))
                  or $path == "Cargo.lock"
                  or ($path | endswith("/Cargo.lock"))
                )
              | [$repository, $commit_sha, $path]
              | @tsv
            ' "$tree_file" | tr -d '\r' >> "$lockfiles"
          done < "$active_repositories"
          sort -u -o "$lockfiles" "$lockfiles"

          lockfile_count=$(wc -l < "$lockfiles")
          if [ "$lockfile_count" -lt "$MIN_LOCKFILES" ]; then
            echo "::error::Expected at least $MIN_LOCKFILES audited lockfiles, found $lockfile_count."
            exit 1
          fi

          while IFS=$'\t' read -r repository commit_sha source_path; do
            tree_file="/tmp/osv-tree-${repository}.json"
            local_path="$scan_root/$ORG/$repository/$source_path"
            mkdir -p "$(dirname "$local_path")"
            gh api -X GET \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/$ORG/$repository/contents/$source_path" \
              -f ref="$commit_sha" > "$local_path"
            if [ ! -s "$local_path" ]; then
              echo "::error::Downloaded an empty lockfile: $repository/$source_path"
              exit 1
            fi

            source_directory=$(dirname "$source_path")
            if [ "$source_directory" = "." ]; then
              config_path=osv-scanner.toml
            else
              config_path="$source_directory/osv-scanner.toml"
            fi
            adjacent_config=""
            if jq -e --arg config_path "$config_path" '
              any(.tree[]; .type == "blob" and .path == $config_path)
            ' "$tree_file" > /dev/null; then
              local_config="$scan_root/$ORG/$repository/$config_path"
              if [ ! -f "$local_config" ]; then
                mkdir -p "$(dirname "$local_config")"
                gh api -X GET \
                  -H 'Accept: application/vnd.github.raw+json' \
                  "repos/$ORG/$repository/contents/$config_path" \
                  -f ref="$commit_sha" > "$local_config"
                if [ ! -s "$local_config" ]; then
                  echo "::error::Downloaded an empty OSV configuration: $repository/$config_path"
                  exit 1
                fi
                printf '%s/%s\n' "$repository" "$config_path" >> "$configurations"
              fi
              adjacent_config="$config_path"
            fi

            jq -cn \
              --arg repository "$ORG/$repository" \
              --arg path "$source_path" \
              --arg localPath "$local_path" \
              --arg configPath "$adjacent_config" \
              --arg commitSha "$commit_sha" \
              '{repository: $repository, path: $path, localPath: $localPath, commitSha: $commitSha, configPath: (if $configPath == "" then null else $configPath end)}' \
              >> "$provenance_ndjson"
          done < "$lockfiles"

          jq -s '.' "$provenance_ndjson" > "$provenance_json"
          jq -e --argjson expected "$lockfile_count" '
            type == "array" and length == $expected
          ' "$provenance_json" > /dev/null
          sort -u -o "$configurations" "$configurations"
          config_count=$(wc -l < "$configurations")
          {
            echo "repository_count=$repository_count"
            echo "lockfile_count=$lockfile_count"
            echo "config_count=$config_count"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared $lockfile_count lockfiles and $config_count adjacent OSV configuration(s) from $repository_count active repositories."

      - name: Install the verified official OSV-Scanner release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSV_SCANNER_ASSET: osv-scanner_linux_amd64
          OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
          OSV_SCANNER_VERSION: "2.5.0"
        run: |
          set -euo pipefail
          release=/tmp/osv-scanner-release.json
          commit=/tmp/osv-scanner-release-commit.json
          scanner=/tmp/osv-scanner
          expected_url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/${OSV_SCANNER_ASSET}"

          gh api "repos/google/osv-scanner/releases/tags/v${OSV_SCANNER_VERSION}" > "$release"
          jq -e \
            --arg tag "v${OSV_SCANNER_VERSION}" \
            --arg asset "$OSV_SCANNER_ASSET" \
            --arg digest "sha256:${OSV_SCANNER_SHA256}" \
            --arg url "$expected_url" '
              .tag_name == $tag
              and .draft == false
              and .prerelease == false
              and ([.assets[] | select(.name == $asset)] | length == 1)
              and ([.assets[] | select(
                .name == $asset
                and .state == "uploaded"
                and (.size | type) == "number"
                and .size > 0
                and .digest == $digest
                and .browser_download_url == $url
              )] | length == 1)
            ' "$release" > /dev/null

          gh api "repos/google/osv-scanner/commits/v${OSV_SCANNER_VERSION}" > "$commit"
          jq -e '
            .commit.verification.verified == true
            and .commit.verification.reason == "valid"
          ' "$commit" > /dev/null

          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 180 \
            --proto '=https' --tlsv1.2 \
            --output "$scanner" "$expected_url"
          printf '%s  %s\n' "$OSV_SCANNER_SHA256" "$scanner" \
            | sha256sum --check --strict -
          chmod 0755 "$scanner"
          "$scanner" --version

      - name: Scan the complete temporary source tree
        id: scan
        run: |
          set -euo pipefail
          scanner=/tmp/osv-scanner
          scan_root=/tmp/osv-workspace
          temporary_json=/tmp/osv-results.partial.json
          result_json=/tmp/osv-results.json
          stderr_file=/tmp/osv-scanner.stderr

          set +e
          "$scanner" scan source \
            --recursive \
            --format json \
            --all-packages \
            --all-vulns \
            --output-file "$temporary_json" \
            --verbosity warn \
            "$scan_root" \
            2> "$stderr_file"
          scanner_code=$?
          set -e
          if [ -s "$stderr_file" ]; then
            sed -e 's/^/[osv-scanner] /' "$stderr_file"
          fi
          case "$scanner_code" in
            0|1)
              ;;
            127)
              echo "::error::OSV-Scanner reported a general operational error (exit 127)."
              exit 1
              ;;
            *)
              if [ "$scanner_code" -ge 128 ]; then
                echo "::error::OSV-Scanner terminated abnormally (exit $scanner_code)."
              else
                echo "::error::OSV-Scanner returned an unsupported exit code ($scanner_code)."
              fi
              exit 1
              ;;
          esac
          if [ ! -s "$temporary_json" ]; then
            echo "::error::OSV-Scanner did not produce complete JSON output."
            exit 1
          fi
          jq -e '
            type == "object"
            and (.results | type == "array")
            and (.experimental_config | type == "object")
            and all(.results[];
              (.source.path | type == "string")
              and (.source.type | type == "string")
              and (.packages | type == "array")
            )
          ' "$temporary_json" > /dev/null
          mv "$temporary_json" "$result_json"

          node scripts/oss-advisory-watch.mjs \
            --input "$result_json" \
            --provenance /tmp/osv-provenance.json \
            --findings /tmp/osv-findings.json \
            --markdown /tmp/osv-issue.md \
            --metadata /tmp/osv-report.json
          finding_count=$(jq -er '.count' /tmp/osv-report.json)
          if [ "$scanner_code" -eq 0 ] && [ "$finding_count" -ne 0 ]; then
            echo "::error::OSV-Scanner exit 0 conflicts with $finding_count normalized finding(s)."
            exit 1
          fi
          if [ "$scanner_code" -eq 1 ] && [ "$finding_count" -eq 0 ]; then
            echo "::error::OSV-Scanner exit 1 conflicts with zero normalized findings."
            exit 1
          fi
          {
            echo "exit_code=$scanner_code"
            echo "finding_count=$finding_count"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile the OSS Advisory Watch issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          finding_count=$(jq -er '.count' /tmp/osv-report.json)
          title=$(jq -er '.title' /tmp/osv-report.json)
          mapfile -t open_issues < <(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title \
              --jq '.[] | select(.title | startswith("OSS Advisory Watch —")) | .number'
          )
          if [ "${#open_issues[@]}" -gt 1 ]; then
            echo "::error::Found multiple open OSS Advisory Watch issues; refusing ambiguous reconciliation."
            exit 1
          fi
          existing="${open_issues[0]:-}"

          if [ "$finding_count" -gt 0 ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" \
                --title "$title" --body-file /tmp/osv-issue.md
              action=updated
              issue_number="$existing"
            else
              issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --body-file /tmp/osv-issue.md)
              action=created
              issue_number="${issue_url##*/}"
            fi
          elif [ -n "$existing" ]; then
            resolution=$(jq -er '.resolutionComment' /tmp/osv-report.json)
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "$resolution"
            action=closed
            issue_number="$existing"
          else
            action=none
            issue_number=""
          fi
          {
            echo "action=$action"
            echo "issue_number=$issue_number"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          CONFIG_COUNT: ${{ steps.sources.outputs.config_count }}
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
          ISSUE_ACTION: ${{ steps.issue.outputs.action }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          LOCKFILE_COUNT: ${{ steps.sources.outputs.lockfile_count }}
          REPOSITORY_COUNT: ${{ steps.sources.outputs.repository_count }}
          SCANNER_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "## OSS Advisory Watch"
            echo
            echo "- Repositórios ativos e não arquivados: $REPOSITORY_COUNT"
            echo "- Lockfiles auditados: $LOCKFILE_COUNT"
            echo "- Configurações OSV adjacentes aplicadas: $CONFIG_COUNT"
            echo "- Código de resultado do OSV-Scanner: $SCANNER_EXIT_CODE"
            echo "- Achados ativos: $FINDING_COUNT"
            echo "- Reconciliação de issue: $ISSUE_ACTION${ISSUE_NUMBER:+ (#$ISSUE_NUMBER)}"
          } >> "$GITHUB_STEP_SUMMARY"
