name: OSS Advisory Watch
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: write-all

concurrency:
  group: oss-advisory-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Cross-reference advisories vs locked org dependencies
    runs-on: ubuntu-latest
    permissions: write-all
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather every npm and Cargo lockfile from active repositories
        id: deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: LCV-Ideas-Software
        run: |
          set -euo pipefail
          mkdir -p /tmp/deps
          : > /tmp/lockfiles.tsv
          gh repo list "$ORG" --limit 100 \
            --json name,isArchived,defaultBranchRef \
            --jq '.[] | select(.isArchived == false) | [.name, .defaultBranchRef.name] | @tsv' \
            | tr -d '\r' \
            > /tmp/active-repositories.tsv

          while IFS=$'\t' read -r repository default_branch; do
            tree_file="/tmp/tree-${repository}.json"
            gh api -X GET "repos/$ORG/$repository/git/trees/$default_branch" \
              -f recursive=1 > "$tree_file"
            if [ "$(jq -r '.truncated' "$tree_file")" != "false" ]; then
              echo "::error::The recursive Git tree for $repository was truncated; lockfile coverage is uncertain."
              exit 1
            fi
            jq -r --arg repository "$repository" --arg branch "$default_branch" '
              .tree[]
              | select(.type == "blob")
              | .path as $path
              | select(
                  $path == "package-lock.json"
                  or ($path | endswith("/package-lock.json"))
                  or $path == "Cargo.lock"
                  or ($path | endswith("/Cargo.lock"))
                )
              | [$repository, $branch, $path]
              | @tsv
            ' "$tree_file" | tr -d '\r' >> /tmp/lockfiles.tsv
          done < /tmp/active-repositories.tsv
          sort -u -o /tmp/lockfiles.tsv /tmp/lockfiles.tsv

          lockfile_count=$(wc -l < /tmp/lockfiles.tsv)
          if [ "$lockfile_count" -lt 17 ]; then
            echo "::error::Expected at least the 17 audited lockfiles, found $lockfile_count."
            exit 1
          fi

          : > /tmp/lockfile-files.tsv
          index=0
          while IFS=$'\t' read -r repository default_branch path; do
            index=$((index + 1))
            case "$path" in
              *package-lock.json)
                ecosystem="npm"
                extension="json"
                ;;
              *Cargo.lock)
                ecosystem="crates.io"
                extension="lock"
                ;;
              *)
                echo "::error::Unexpected lockfile path: $repository/$path"
                exit 1
                ;;
            esac
            local_path=$(printf '/tmp/deps/%03d.%s' "$index" "$extension")
            gh api -X GET \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/$ORG/$repository/contents/$path" \
              -f ref="$default_branch" > "$local_path"
            if [ ! -s "$local_path" ]; then
              echo "::error::Downloaded an empty lockfile: $repository/$path"
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\n' \
              "$repository" "$path" "$ecosystem" "$local_path" \
              >> /tmp/lockfile-files.tsv
          done < /tmp/lockfiles.tsv

          : > /tmp/npm-deps.tsv
          while IFS=$'\t' read -r repository path ecosystem local_path; do
            if [ "$ecosystem" != "npm" ]; then
              continue
            fi
            jq -er '
              .packages
              | to_entries[]
              | select(.key != "" and (.value.version | type) == "string")
              | [(.key | split("/node_modules/") | last), .value.version]
              | @tsv
            ' "$local_path" >> /tmp/npm-deps.tsv
          done < /tmp/lockfile-files.tsv
          sort -u -o /tmp/npm-deps.tsv /tmp/npm-deps.tsv

          python3 - <<'PY' > /tmp/cargo-deps.tsv
          import csv
          import tomllib

          with open("/tmp/lockfile-files.tsv", encoding="utf-8", newline="") as manifest:
              for _repository, _path, ecosystem, local_path in csv.reader(manifest, delimiter="\t"):
                  if ecosystem != "crates.io":
                      continue
                  with open(local_path, "rb") as lockfile:
                      packages = tomllib.load(lockfile).get("package", [])
                  if not isinstance(packages, list):
                      raise SystemExit("Cargo.lock package inventory is malformed")
                  for package in packages:
                      name = package.get("name")
                      version = package.get("version")
                      if not isinstance(name, str) or not isinstance(version, str):
                          raise SystemExit("Cargo.lock contains an invalid package entry")
                      print(f"{name}\t{version}")
          PY
          sort -u -o /tmp/cargo-deps.tsv /tmp/cargo-deps.tsv

          npm_count=$(wc -l < /tmp/npm-deps.tsv)
          cargo_count=$(wc -l < /tmp/cargo-deps.tsv)
          if [ "$npm_count" -eq 0 ] || [ "$cargo_count" -eq 0 ]; then
            echo "::error::Dependency extraction returned an empty npm or crates.io inventory."
            exit 1
          fi
          {
            echo "count=$((npm_count + cargo_count))"
            echo "lockfile_count=$lockfile_count"
            echo "npm_count=$npm_count"
            echo "cargo_count=$cargo_count"
          } >> "$GITHUB_OUTPUT"
          echo "Found $npm_count npm and $cargo_count crates.io package/version pairs across $lockfile_count lockfiles."

      - name: Query OSV for exact locked npm and crates.io versions
        id: osv
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          dependencies = set()
          for ecosystem, filename in (
              ("npm", "/tmp/npm-deps.tsv"),
              ("crates.io", "/tmp/cargo-deps.tsv"),
          ):
              with open(filename, encoding="utf-8", newline="") as source:
                  for name, version in csv.reader(source, delimiter="\t"):
                      dependencies.add((ecosystem, name, version))

          queries = [
              {
                  "package": {"ecosystem": ecosystem, "name": name},
                  "version": version,
              }
              for ecosystem, name, version in sorted(dependencies)
          ]
          if not queries:
              raise SystemExit("No locked dependency versions were available for OSV")

          batch_size = 500
          for index in range(0, len(queries), batch_size):
              batch = {"queries": queries[index:index + batch_size]}
              target = Path(f"/tmp/osv-query-{index // batch_size:04d}.json")
              target.write_text(json.dumps(batch, separators=(",", ":")), encoding="utf-8")
          PY

          : > /tmp/osv-findings.ndjson
          for request in /tmp/osv-query-*.json; do
            response="${request/query/response}"
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 120 \
              --proto '=https' --tlsv1.2 \
              --header 'Content-Type: application/json' \
              --data-binary "@$request" \
              --output "$response" \
              'https://api.osv.dev/v1/querybatch'

            query_count=$(jq -er '.queries | length' "$request")
            result_count=$(jq -er '.results | length' "$response")
            if [ "$result_count" -ne "$query_count" ]; then
              echo "::error::OSV returned $result_count result slots for $query_count exact-version queries."
              exit 1
            fi
            if jq -e '.results[]? | select(.next_page_token != null)' \
              "$response" > /dev/null; then
              echo "::error::OSV paginated an exact-version result; refusing an incomplete advisory inventory."
              exit 1
            fi

            python3 - "$request" "$response" <<'PY' >> /tmp/osv-findings.ndjson
          import json
          import sys

          request = json.load(open(sys.argv[1], encoding="utf-8"))
          response = json.load(open(sys.argv[2], encoding="utf-8"))
          for query, result in zip(request["queries"], response["results"], strict=True):
              for vulnerability in result.get("vulns", []):
                  vulnerability_id = vulnerability["id"]
                  print(json.dumps({
                      "ghsaId": vulnerability_id,
                      "severity": "UNKNOWN",
                      "ecosystem": query["package"]["ecosystem"],
                      "package": query["package"]["name"],
                      "installed_version": query["version"],
                      "vulnerable_range": "Exact locked version matched by OSV",
                      "first_patched": None,
                      "summary": "OSV matched this exact locked dependency version.",
                      "permalink": f"https://osv.dev/vulnerability/{vulnerability_id}",
                  }, separators=(",", ":")))
          PY
          done

          jq -s '
            unique_by([.ecosystem, .ghsaId, .package, .installed_version])
          ' /tmp/osv-findings.ndjson > /tmp/findings.json
          count=$(jq 'length' /tmp/findings.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "OSV matched $count advisory/package/version tuple(s) in exact locked dependencies."

      - name: Preview exact-version advisory findings
        id: match
        run: |
          set -euo pipefail
          count=$(jq 'length' /tmp/findings.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "===== findings preview ====="
            jq '.[0:10]' /tmp/findings.json
          fi

      - name: Report findings (open or update issue)
        if: steps.match.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          generated_at=$(TZ=Etc/GMT+3 date '+%d/%m/%Y %Hh%M')
          # Build markdown body
          body=$(jq -r --arg generated_at "$generated_at" '
            "## OSS Advisory Watch — \(length) findings against locked organization dependencies\n\n"
            + "_Source: OSV.dev exact-version queries for locked npm and crates.io dependencies._\n"
            + "_Generated: \($generated_at)_\n\n"
            + (group_by(.severity) | sort_by(
                if .[0].severity == "CRITICAL" then 0
                elif .[0].severity == "HIGH" then 1
                elif .[0].severity == "MODERATE" then 2
                elif .[0].severity == "LOW" then 3
                else 4 end
              ) | map(
                "### \(.[0].severity) (\(length))\n\n"
                + (map(
                    "- **\(.package)** (`\(.ecosystem)`) — [\(.ghsaId)](\(.permalink))\n"
                    + (if .installed_version then "  - Installed: `\(.installed_version)`\n" else "" end)
                    + "  - Vulnerable: `\(.vulnerable_range)`\n"
                    + "  - First patched: `\(.first_patched // "n/a")`\n"
                    + "  - Summary: \(.summary)\n"
                  ) | join(""))
                + "\n"
              ) | join(""))
          ' /tmp/findings.json)
          # Find existing open issue with title prefix
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "OSS Advisory Watch in:title" --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Commented on existing #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "OSS Advisory Watch — $(TZ=Etc/GMT+3 date +%d-%m-%Y)" \
              --body "$body"
          fi

      - name: Summary
        env:
          CARGO_DEPENDENCY_COUNT: ${{ steps.deps.outputs.cargo_count }}
          DEPENDENCY_COUNT: ${{ steps.deps.outputs.count }}
          FINDING_COUNT: ${{ steps.match.outputs.count }}
          LOCKFILE_COUNT: ${{ steps.deps.outputs.lockfile_count }}
          NPM_DEPENDENCY_COUNT: ${{ steps.deps.outputs.npm_count }}
          OSV_FINDING_COUNT: ${{ steps.osv.outputs.count }}
        run: |
          echo "Audited lockfiles: $LOCKFILE_COUNT"
          echo "Installed npm unique pkg/version pairs: $NPM_DEPENDENCY_COUNT"
          echo "Installed crates.io unique pkg/version pairs: $CARGO_DEPENDENCY_COUNT"
          echo "Total installed unique pkg/version pairs: $DEPENDENCY_COUNT"
          echo "OSV exact-version matches: $OSV_FINDING_COUNT"
          echo "Reported exact-version findings: $FINDING_COUNT"
