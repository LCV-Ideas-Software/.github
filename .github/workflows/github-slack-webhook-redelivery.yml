name: GitHub Slack Webhook Redelivery

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Audit the hook or audit and recover failed deliveries
        required: true
        default: audit
        type: choice
        options:
          - audit
          - redeliver

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-slack-webhook-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  redeliver:
    name: Audit and recover organization webhook deliveries
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      vars.SLACK_GITHUB_INTEGRATION_ENABLED == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      HOOK_ID: ${{ vars['SLACK_RELAY_ORG_HOOK_ID'] }}
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Test webhook liveness and redelivery controllers
        run: >-
          node --test
          scripts/github-slack-hook-audit.test.mjs
          scripts/github-slack-webhook-redelivery.test.mjs

      - name: Validate required configuration
        env:
          TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::Required secret LCV_AUTOMATION_TOKEN is missing."
            exit 1
          fi
          if [[ -z "${HOOK_ID}" ]]; then
            echo "::error::Required variable SLACK_RELAY_ORG_HOOK_ID is missing."
            exit 1
          fi
          if [[ ! "${HOOK_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::SLACK_RELAY_ORG_HOOK_ID must be a positive integer."
            exit 1
          fi

      - name: Audit active PAT-owned organization webhook without mutation
        env:
          GITHUB_REF: ${{ github.ref }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          WORKFLOW_REPO_NAME: ${{ github.event.repository.name }}
          WORKFLOW_REPO_OWNER: ${{ github.repository_owner }}
        run: node scripts/github-slack-hook-audit.mjs

      - name: Require the production gate for requested recovery
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'redeliver'
        env:
          INTEGRATION_ENABLED: ${{ vars.SLACK_GITHUB_INTEGRATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INTEGRATION_ENABLED" != "true" ]]; then
            echo "::error::Redelivery requires SLACK_GITHUB_INTEGRATION_ENABLED=true."
            exit 1
          fi

      - name: Recover failed webhook deliveries
        if: >-
          vars.SLACK_GITHUB_INTEGRATION_ENABLED == 'true' &&
          (github.event_name == 'schedule' ||
          inputs.operation == 'redeliver')
        env:
          TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          ORGANIZATION_ID: ${{ github.repository_owner_id }}
          WORKFLOW_REPO_OWNER: ${{ github.repository_owner }}
          WORKFLOW_REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/github-slack-webhook-redelivery.mjs
