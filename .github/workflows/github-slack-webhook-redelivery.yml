name: GitHub Slack Webhook Redelivery

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Audit the hook or audit and recover failed deliveries
        required: true
        default: audit
        type: choice
        options:
          - audit
          - redeliver

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-slack-webhook-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  redeliver:
    name: Redeliver failed organization webhook deliveries
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      vars.SLACK_GITHUB_INTEGRATION_ENABLED == 'true')
    permissions:
      actions: read # Read the last successful schedule used as the continuity checkpoint.
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: webhook-recovery
    env:
      HOOK_ID: ${{ vars['SLACK_RELAY_ORG_HOOK_ID'] }}
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Test webhook liveness and redelivery controllers
        run: >-
          node --test
          scripts/github-slack-hook-audit.test.mjs
          scripts/github-slack-webhook-redelivery.test.mjs

      - name: Validate required configuration
        env:
          APP_CLIENT_ID: ${{ vars.SLACK_REDELIVERY_APP_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLIENT_ID}" ]]; then
            echo "::error::Required variable SLACK_REDELIVERY_APP_CLIENT_ID is missing."
            exit 1
          fi
          if [[ -z "${HOOK_ID}" ]]; then
            echo "::error::Required variable SLACK_RELAY_ORG_HOOK_ID is missing."
            exit 1
          fi
          if [[ ! "${HOOK_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::SLACK_RELAY_ORG_HOOK_ID must be a positive integer."
            exit 1
          fi

      - name: Require the production gate for requested recovery
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'redeliver'
        env:
          INTEGRATION_ENABLED: ${{ vars.SLACK_GITHUB_INTEGRATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INTEGRATION_ENABLED" != "true" ]]; then
            echo "::error::Redelivery requires SLACK_GITHUB_INTEGRATION_ENABLED=true."
            exit 1
          fi

      - name: Mint read-only GitHub App token for audit
        id: audit-app-token
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'audit'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SLACK_REDELIVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SLACK_REDELIVERY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-hooks: read
          skip-token-revoke: false

      - name: Mint least-privilege GitHub App token for recovery
        id: recovery-app-token
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'redeliver')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SLACK_REDELIVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SLACK_REDELIVERY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-hooks: write
          skip-token-revoke: false

      - name: Validate exact GitHub App identity
        env:
          APP_SLUG: ${{ steps.audit-app-token.outputs.app-slug || steps.recovery-app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.audit-app-token.outputs.installation-id || steps.recovery-app-token.outputs.installation-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${APP_SLUG}" != "lcv-slack-webhook-recovery" ]]; then
            echo "::error::The minted token does not belong to the expected GitHub App."
            exit 1
          fi
          if [[ ! "${INSTALLATION_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The GitHub App installation ID is missing or invalid."
            exit 1
          fi

      - name: Audit active App-visible organization webhook without mutation
        env:
          GITHUB_REF: ${{ github.ref }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          TOKEN: ${{ steps.audit-app-token.outputs.token || steps.recovery-app-token.outputs.token }}
          WORKFLOW_REPO_NAME: ${{ github.event.repository.name }}
          WORKFLOW_REPO_OWNER: ${{ github.repository_owner }}
        run: node scripts/github-slack-hook-audit.mjs

      - name: Recover failed webhook deliveries
        if: >-
          vars.SLACK_GITHUB_INTEGRATION_ENABLED == 'true' &&
          (github.event_name == 'schedule' ||
          inputs.operation == 'redeliver')
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          HOOK_TOKEN: ${{ steps.recovery-app-token.outputs.token }}
          ORGANIZATION_NAME: ${{ github.repository_owner }}
          ORGANIZATION_ID: ${{ github.repository_owner_id }}
          WORKFLOW_REPO_OWNER: ${{ github.repository_owner }}
          WORKFLOW_REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/github-slack-webhook-redelivery.mjs
