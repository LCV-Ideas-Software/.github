name: GitHub Actions Pin Audit

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions: write-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-actions-pin-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit Action pins, runtimes, and tools across the organization
    runs-on: ubuntu-latest
    permissions: write-all
    environment:
      name: github-administration
      deployment: false
    timeout-minutes: 25
    steps:
      - name: Checkout the read-only auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup latest Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Validate the auditor and its API mocks
        run: |
          set -euo pipefail
          node --check scripts/github-actions-pin-audit.mjs
          node --test scripts/github-actions-pin-audit.test.mjs

      - name: Audit every active repository through read-only official APIs
        env:
          GITHUB_TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
          ORGANIZATION: LCV-Ideas-Software
          MIN_ACTIVE_REPOSITORIES: "11"
        run: node scripts/github-actions-pin-audit.mjs
