name: Environment Token Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the exact authorization phrase
        required: true
        type: string
      scope:
        description: Provision only the canary or every approved environment
        required: true
        type: choice
        options:
          - canary
          - all

permissions: write-all

concurrency:
  group: environment-token-bootstrap
  cancel-in-progress: false

jobs:
  provision:
    name: Copy the existing classic PAT to protected environments
    runs-on: ubuntu-latest
    permissions: write-all
    timeout-minutes: 10
    env:
      EXPECTED_ACTOR: lcv-leo
      EXPECTED_CONFIRMATION: provision-approved-environment-token
      SOURCE_TOKEN: ${{ secrets.LCV_AUTOMATION_TOKEN }}
    steps:
      - name: Validate immutable execution context and credential owner
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_SCOPE: ${{ inputs.scope }}
          EXECUTION_REF: ${{ github.ref }}
          EXECUTION_REPOSITORY: ${{ github.repository }}
          EXECUTION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EXECUTION_REPOSITORY" != "LCV-Ideas-Software/.github" ]; then
            echo "::error::Unexpected repository context."
            exit 1
          fi
          if [ "$EXECUTION_REF" != "refs/heads/main" ]; then
            echo "::error::This bootstrap may run only from main."
            exit 1
          fi
          if [ "$DISPATCH_ACTOR" != "$EXPECTED_ACTOR" ]; then
            echo "::error::Unauthorized dispatch actor."
            exit 1
          fi
          if [ "$DISPATCH_CONFIRMATION" != "$EXPECTED_CONFIRMATION" ]; then
            echo "::error::The explicit confirmation phrase is invalid."
            exit 1
          fi
          case "$DISPATCH_SCOPE" in
            canary|all) ;;
            *)
              echo "::error::Unsupported provisioning scope."
              exit 1
              ;;
          esac
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::The repository PAT source is unavailable."
            exit 1
          fi

          verification=$(GH_TOKEN="$SOURCE_TOKEN" gh api \
            "repos/$EXECUTION_REPOSITORY/commits/$EXECUTION_SHA" \
            --jq '.commit.verification.verified and .commit.verification.reason == "valid"')
          if [ "$verification" != "true" ]; then
            echo "::error::The bootstrap commit is not GitHub-verified."
            exit 1
          fi
          login=$(GH_TOKEN="$SOURCE_TOKEN" gh api user --jq '.login')
          if [ "$login" != "$EXPECTED_ACTOR" ]; then
            echo "::error::The source credential belongs to an unexpected account."
            exit 1
          fi

      - name: Provision the approved environment targets
        env:
          DISPATCH_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          targets=$(mktemp)
          trap 'rm -f "$targets"' EXIT
          cat > "$targets" <<'TARGETS'
          LCV-Ideas-Software/calculadora-app	dependabot-automation	canary
          LCV-Ideas-Software/.github	cloudflare-production	all
          LCV-Ideas-Software/.github	github-administration	all
          LCV-Ideas-Software/admin-app	dependabot-automation	all
          LCV-Ideas-Software/astrologo-app	dependabot-automation	all
          LCV-Ideas-Software/cross-review	dependabot-automation	all
          LCV-Ideas-Software/cross-review	github-administration	all
          LCV-Ideas-Software/cross-review	github-release-production	all
          LCV-Ideas-Software/cross-review	github-release-recovery	all
          LCV-Ideas-Software/maestro-app	dependabot-automation	all
          LCV-Ideas-Software/mainsite-app	dependabot-automation	all
          LCV-Ideas-Software/mtasts-motor	dependabot-automation	all
          LCV-Ideas-Software/oraculo-financeiro	dependabot-automation	all
          LCV-Ideas-Software/sponsor-motor	dependabot-automation	all
          LCV-Ideas-Software/ultrabrain-mcp	dependabot-automation	all
          LCV-Ideas-Software/ultrabrain-mcp	github-administration	all
          LCV-Ideas-Software/ultrabrain-mcp	github-release-production	all
          LCV-Ideas-Software/.github	dependabot-automation	all
          TARGETS

          provisioned=0
          while IFS=$'\t' read -r repository environment tier; do
            if [ "$DISPATCH_SCOPE" = "canary" ] && [ "$tier" != "canary" ]; then
              continue
            fi
            printf '%s' "$SOURCE_TOKEN" \
              | GH_TOKEN="$SOURCE_TOKEN" gh secret set LCV_AUTOMATION_TOKEN \
                  --repo "$repository" --env "$environment"
            GH_TOKEN="$SOURCE_TOKEN" gh api \
              "repos/$repository/environments/$environment/secrets/LCV_AUTOMATION_TOKEN" \
              --jq 'if .name == "LCV_AUTOMATION_TOKEN" then empty else error("unexpected secret metadata") end'
            echo "Provisioned $repository / $environment."
            provisioned=$((provisioned + 1))
          done < "$targets"

          expected=18
          if [ "$DISPATCH_SCOPE" = "canary" ]; then
            expected=1
          fi
          if [ "$provisioned" -ne "$expected" ]; then
            echo "::error::Expected $expected provisioned targets, completed $provisioned."
            exit 1
          fi
          echo "Provisioned $provisioned approved environment target(s)."
